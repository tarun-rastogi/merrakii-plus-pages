    :root {
      --brand: #c1121f;
      --brand-dark: #9b0f19;
      --navy: #1c2340;
      --muted: #64748b;
      --line: #e2e8f0;
      --slide-w: 960px;
      --slide-h: 540px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--navy);
      background: #f1f5f9;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .btn {
      font: 600 14px inherit;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #4361ee, #7c3aed);
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .toolbar-note { font-size: 13px; color: var(--muted); max-width: 560px; }
    .deck { padding: 32px 24px 64px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .slide {
      width: min(100%, var(--slide-w));
      aspect-ratio: 16 / 9;
      background: #fff;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 8px 32px rgba(28,35,64,.12);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      page-break-after: always;
    }
    .slide-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 3px solid var(--brand);
      color: var(--navy);
    }
    .slide-head .logos {
      display: flex;
      align-items: center;
    }
    .slide-head img { height: 30px; object-fit: contain; display: block; }
    .slide-num { font-size: 11px; font-weight: 600; color: var(--muted); }
    .slide-body {
      display: grid;
      grid-template-columns: 0.85fr 1.35fr;
      gap: 12px;
      padding: 14px 16px 16px;
      min-height: 0;
    }
    .slide-body.text-only { grid-template-columns: 1fr; }
    .slide-body.title-slide {
      grid-template-columns: 1fr;
      place-content: center;
      text-align: center;
      padding: 32px;
    }
    .slide-body.title-slide h1 { font-size: 2rem; margin: 0 0 12px; color: var(--navy); }
    .slide-body.title-slide p { font-size: 1.05rem; color: var(--muted); max-width: 640px; margin: 0 auto; }
    .slide-body.title-slide.first-title {
      position: relative;
      background: linear-gradient(135deg, #fffbfb 0%, #fff8f8 40%, #ffffff 100%);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .slide-body.title-slide.first-title::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 65% 55% at 10% 88%, rgba(193, 18, 31, 0.035) 0%, transparent 72%),
        radial-gradient(ellipse 48% 42% at 92% 10%, rgba(193, 18, 31, 0.025) 0%, transparent 68%);
      pointer-events: none;
    }
    .slide-body.title-slide.first-title > div {
      position: relative;
      z-index: 1;
    }
    .title-dess-line {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--navy);
      margin: 0 auto 14px;
      max-width: 680px;
      line-height: 1.45;
    }
    .brand-accent {
      color: var(--brand);
      font-weight: 800;
    }
    .title-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(193, 18, 31, 0.12);
      color: var(--brand);
      margin-bottom: 12px;
      border: 1px solid rgba(193, 18, 31, 0.2);
    }
    .slide-copy h2 { margin: 0 0 8px; font-size: 1.15rem; color: var(--brand-dark); }
    .slide-copy p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.5; color: #334155; }
    .slide-copy ul { margin: 6px 0 0; padding-left: 1.1rem; font-size: 13px; line-height: 1.45; color: #475569; }
    .slide-copy li { margin-bottom: 4px; }
    .slide-body:has(.shot-wrap) .slide-copy p {
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto;
    }
    .slide-copy.dense p { font-size: 12.5px; line-height: 1.45; }
    .slide-copy.dense ul { font-size: 11.5px; line-height: 1.4; }
    .slide-copy.dense h2 { font-size: 1.05rem; }
    .shot-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #f8fafc;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      max-height: 100%;
    }
    .shot-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      object-position: top;
    }
    .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: #fee2e2;
      color: var(--brand-dark);
      margin-bottom: 6px;
    }
    table.comp { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    table.comp th, table.comp td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
    table.comp th { background: #fff7ed; font-weight: 600; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .metric {
      padding: 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--line);
      text-align: center;
    }
    .metric strong { display: block; font-size: 1.25rem; color: var(--brand); }
    .metric span { font-size: 11px; color: var(--muted); }
    .slide-foot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 16px;
      min-height: 34px;
      background: #f8fafc;
      border-top: 1px solid var(--line);
    }
    .slide-foot img {
      height: 34px;

      width: auto;

      display: block;
      flex-shrink: 0;

      flex-wrap: wrap;
      gap: 0;
      font-size: 11px;
      font-weight: 600;

      margin: 0 8px;
      color: #cbd5e1;
      font-weight: 400;
    }
    @page {
      size: landscape;
      margin: 0;
    }

    @media print {
      .toolbar,
      .no-print { display: none !important; }

      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100%;
        height: 100%;
        background: #fff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .deck {
        display: block;
        margin: 0;
        padding: 0;
        gap: 0;
        width: 100%;

      .slide {
        display: grid;
        grid-template-rows: auto 1fr auto;
        border: none;
        box-shadow: none;
        border-radius: 0;
        width: 100vw;
        max-width: none;
        height: 100vh;
        min-height: 100vh;
        max-height: 100vh;
        aspect-ratio: unset;
        margin: 0;
        padding: 0;
        overflow: hidden;
        break-after: page;
        page-break-after: always;
        break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .slide:last-child {

        page-break-after: auto;
      }

      }

      .slide-body {

      .slide-foot {

        margin-top: auto;

      .slide-foot,

      table.comp th,
      .metric,

      .slide-body.title-slide.first-title::before,

    const STRIP_KEYWORDS = ["Product Engineering Partner", "Ship Fast", "Enterprise-Grade Delivery"];
    const STRIP_PPT_TEXT = "Maple AI Technologies · Product Engineering Partner · Ship Fast · Enterprise-Grade Delivery";

    function buildSlideFoot() {
      const foot = document.createElement("div");
      foot.className = "slide-foot";
      const kwHtml = STRIP_KEYWORDS.map((k, i) =>
        `${i ? '<span class="kw-sep">·</span>' : ""}<span>${k}</span>`
      ).join("");
      foot.innerHTML = `<img src="images/maple-ai-logo.jpg" alt="Maple AI Technologies" /><span class="keywords">${kwHtml}</span>`;
      return foot;
    }

    function addPptSlideFoot(slide, pptx, logoData) {
      const footH = 0.28;
      const footY = 5.625 - footH;
      slide.addShape(pptx.ShapeType.rect, {
        x: 0, y: footY, w: "100%", h: footH,
        fill: { color: "F8FAFC" },
        line: { color: "E2E8F0", pt: 0.5 }
      });
      if (logoData) {
        slide.addImage({
          data: logoData,
          x: 0.25, y: footY + 0.02, w: 0.55, h: 0.24,
          sizing: { type: "contain", w: 0.55, h: 0.24 }
        });
      }
      slide.addText(STRIP_PPT_TEXT, {
        x: logoData ? 0.88 : 0.35, y: footY + 0.06, w: 8.4, h: 0.18,
        fontSize: 8, color: "64748B", fontFace: "Arial", bold: true
      });
    }

      const lead = b.bold ? `<strong>${b.bold}</strong>` : "";
      const sep = b.bold && b.text ? " " : "";
      return `${lead}${sep}${b.text || ""}`;
    }

    function htmlToPptRuns(html) {
      return html.split(/(<strong>.*?<\/strong>)/g).filter(Boolean).map((part) => {
        const m = part.match(/^<strong>(.*)<\/strong>$/);
        return m ? { text: m[1], options: { bold: true } } : { text: part };
      });
    }

    function bulletPptRuns(b, prefix) {
      if (typeof b === "string") return [{ text: `${prefix}${b}\n` }];
      const runs = [{ text: prefix }];
      if (b.bold) runs.push({ text: b.bold, options: { bold: true } });
      const rest = b.text ? (b.bold ? " " + b.text : b.text) : "";
      runs.push({ text: (rest || "") + "\n" });
      return runs;
    }

    function buildRichTextBlock(intro, bullets) {
      const runs = [];
      if (intro) {
        runs.push(...htmlToPptRuns(intro));
        runs.push({ text: "\n\n" });
      }
      bullets.forEach((b) => {
        runs.push(...bulletPptRuns(b, "• "));
      });
      return runs;
    }

    function renderSlides() {
      SLIDES.forEach((s, i) => {
        const el = document.createElement("section");
        el.className = "slide";
        el.dataset.index = String(i);

        const head = document.createElement("div");
        head.className = "slide-head";
        head.innerHTML = `<div class="logos"><img src="images/merrakii-logo.png" alt="Merrakii+" /></div><span class="slide-num">Slide ${i + 1} of ${SLIDES.length}</span>`;
        el.appendChild(head);

        const body = document.createElement("div");
        body.className = "slide-body";

        if (s.type === "title") {
          body.classList.add("title-slide");
          if (i === 0) body.classList.add("first-title");
          const badgeHtml = s.badge ? `<span class="title-badge">${s.badge}</span>` : "";
          const dessHtml = s.dess ? `<p class="title-dess-line">${s.dess}</p>` : "";
          body.innerHTML = `<div>${badgeHtml}<h1>${s.title}</h1>${dessHtml}<p>${s.subtitle || ""}</p>${s.meta ? `<p style="margin-top:16px;font-size:13px">${s.meta}</p>` : ""}</div>`;
        } else if (s.type === "business") {
          body.classList.add("text-only");
          body.innerHTML = `<div class="slide-copy dense"><span class="tag">Business</span><h2>${s.title}</h2>${s.intro ? `<p>${s.intro}</p>` : ""}<ul>${s.bullets.map((b) => `<li>${bulletHtml(b)}</li>`).join("")}</ul></div>`;
        } else if (s.type === "partner") {
          body.classList.add("text-only");
          body.innerHTML = `<div class="slide-copy dense"><span class="tag">Partnership</span><h2>${s.title}</h2>${s.intro ? `<p>${s.intro}</p>` : ""}<ul>${s.bullets.map((b) => `<li>${bulletHtml(b)}</li>`).join("")}</ul></div>`;
        } else if (s.type === "roi") {
          body.classList.add("text-only");
          body.innerHTML = `<div class="slide-copy"><span class="tag">Commercial</span><h2>${s.title}</h2><p>${s.intro}</p><div class="metric-grid"><div class="metric"><strong>₹15L</strong><span>One-time build (Quotation)</span></div><div class="metric"><strong>Aug 2026</strong><span>Target go-live</span></div><div class="metric"><strong>9–15 mo</strong><span>Illustrative payback range</span></div></div><ul>${s.scenarios.map((sc) => `<li><strong>${sc.label}:</strong> ${sc.math}</li>`).join("")}</ul><p style="font-size:12px;color:var(--muted)"><em>${s.note}</em></p></div>`;
        } else if (s.type === "compare") {
          body.classList.add("text-only");
          body.innerHTML = `<div class="slide-copy"><span class="tag">Comparison</span><h2>${s.title}</h2><table class="comp"><thead><tr><th>Dimension</th><th>Merrakii marketplace</th><th>Merrakii+ DESSS</th></tr></thead><tbody>${s.rows.map((r) => `<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>`;
        } else {
          body.innerHTML = `
            <div class="slide-copy">
              <span class="tag">${s.tag}</span>
              <h2>${s.title}</h2>
              <p><strong>What it is:</strong> ${s.what}</p>
              <p><strong>Purpose:</strong> ${s.purpose}</p>
              <p><strong>Who uses it:</strong> ${s.who}</p>
            </div>
            <div class="shot-wrap"><img src="${s.image}" alt="${s.title} screen" loading="eager" decoding="async" /></div>`;
        }

        el.appendChild(body);
        el.appendChild(buildSlideFoot());
        deck.appendChild(el);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Image load failed: " + src));
        img.src = src;
      });
    }

    async function imageFromDom(src) {
      let img = document.querySelector(`img[src="${src}"]`);
      if (!img || !img.complete || img.naturalWidth === 0) {
        img = await loadImage(src);
      }
      const maxW = 800;
      const scale = img.naturalWidth > maxW ? maxW / img.naturalWidth : 1;
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      return canvas.toDataURL("image/jpeg", 0.82);
    }

    async function exportPpt() {
      const btn = document.getElementById("exportPptBtn");
      btn.disabled = true;
      btn.textContent = "Building PPT…";

      try {
        const pptx = new PptxGenJS();
        pptx.layout = "LAYOUT_16x9";
        pptx.author = "Maple AI Technologies";
        pptx.title = "Merrakii+ Product Walkthrough";
        pptx.subject = "Screen-by-screen guide and business case";

        const imageCache = {};
        let mapleLogoData = null;
        try {
          mapleLogoData = await imageFromDom("images/maple-ai-logo.jpg");
        } catch (_) { /* footer text still renders without logo */ }
        for (const s of SLIDES) {
          if (s.image && !imageCache[s.image]) {
            btn.textContent = `Building PPT… (${s.title})`;
            imageCache[s.image] = await imageFromDom(s.image);
          }
        }
        btn.textContent = "Building PPT… (writing file)";

        SLIDES.forEach((s, idx) => {
          const slide = pptx.addSlide();
          slide.background = { color: "FFFFFF" };

          slide.addShape(pptx.ShapeType.rect, {
            x: 0, y: 0, w: "100%", h: 0.45,
            fill: { color: "FFFFFF" },
            line: { color: "C1121F", pt: 2 }
          });
          slide.addText(`Merrakii+  ·  Slide ${idx + 1}`, {
            x: 0.3, y: 0.1, w: 9, h: 0.3,
            fontSize: 11, color: "1C2340", fontFace: "Arial"
          });

          if (s.type === "title") {
            slide.addText(s.title, { x: 0.6, y: 1.6, w: 8.8, h: 1, fontSize: 28, bold: true, color: "1C2340", fontFace: "Arial" });
            if (s.subtitle) slide.addText(s.subtitle, { x: 0.6, y: 2.6, w: 8.8, h: 1.2, fontSize: 14, color: "64748B", fontFace: "Arial" });
            if (s.meta) slide.addText(s.meta, { x: 0.6, y: 4.2, w: 8.8, h: 0.6, fontSize: 11, color: "888FA8", fontFace: "Arial" });
          } else if (s.type === "business" || s.type === "partner") {
            slide.addText(s.title, { x: 0.4, y: 0.52, w: 9.2, h: 0.55, fontSize: 17, bold: true, color: "9B0F19", fontFace: "Arial" });
            slide.addText(buildRichTextBlock(s.intro, s.bullets), {
              x: 0.4, y: 1.05, w: 9.2, h: 4.25, fontSize: 10, color: "334155", fontFace: "Arial", valign: "top"
            });
          } else if (s.type === "roi") {
            slide.addText(s.title, { x: 0.4, y: 0.55, w: 9.2, h: 0.5, fontSize: 20, bold: true, color: "9B0F19", fontFace: "Arial" });
            const roiText = [s.intro, "", ...s.scenarios.map((sc) => `${sc.label}: ${sc.math}`), "", s.note].join("\n");
            slide.addText(roiText, { x: 0.4, y: 1.05, w: 9.2, h: 4.3, fontSize: 11, color: "334155", fontFace: "Arial", valign: "top" });
          } else if (s.type === "compare") {
            slide.addText(s.title, { x: 0.4, y: 0.55, w: 9.2, h: 0.45, fontSize: 18, bold: true, color: "9B0F19", fontFace: "Arial" });
            const rows = [["Dimension", "Merrakii marketplace", "Merrakii+ DESSS"], ...s.rows];
            slide.addTable(rows, {
              x: 0.25, y: 1.0, w: 9.5,
              fontSize: 9, fontFace: "Arial",
              border: { type: "solid", color: "E2E8F0", pt: 0.5 },
              fill: { color: "FFFFFF" },
              color: "1C2340",
              valign: "top"
            });
          } else {
            slide.addText(s.title, { x: 0.35, y: 0.52, w: 2.75, h: 0.4, fontSize: 16, bold: true, color: "9B0F19", fontFace: "Arial" });
            const copy = [
              `What it is: ${s.what}`,
              "",
              `Purpose: ${s.purpose}`,
              "",
              `Who uses it: ${s.who}`
            ].join("\n");
            slide.addText(copy, { x: 0.35, y: 0.95, w: 2.75, h: 4.0, fontSize: 10, color: "334155", fontFace: "Arial", valign: "top", align: "justify" });

            if (s.image && imageCache[s.image]) {
              slide.addImage({ data: imageCache[s.image], x: 3.2, y: 0.75, w: 6.825, h: 4.59, sizing: { type: "contain", w: 6.825, h: 4.59 } });
            }
          }

          addPptSlideFoot(slide, pptx, mapleLogoData);
        });

        await pptx.writeFile({ fileName: "Merrakii_plus_Product_Walkthrough.pptx" });
      } catch (err) {
        console.error(err);
        alert("Export failed: " + err.message + "\n\nTip: open via a local server if images do not load from disk, e.g. cd deliverable/presentation && python3 -m http.server 8765");
      } finally {
        btn.disabled = false;
        btn.textContent = "Export as PPT";
      }
    }

    renderSlides();
    document.getElementById("exportPptBtn").addEventListener("click", exportPpt);
    document.getElementById("exportPdfBtn").addEventListener("click", function () {
      document.title = "Merrakii+ Product Walkthrough";
      window.print();
    });
  </script>
</body>
</html>
