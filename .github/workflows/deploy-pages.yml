# Publish this repository as GitHub Pages via Actions (avoids flaky legacy branch builds).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
set -euo pipefail
mkdir -p _site
rsync -a --delete \
  --exclude '.git/' \
  --exclude '.github/' \
  --exclude '_site/' \
  ./ _site/
touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
